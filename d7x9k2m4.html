<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#0f172a">
  <title>Authorized Access Only</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vault-container {
      text-align: center;
      padding: 24px;
      width: 100%;
      max-width: 420px;
    }

    .vault-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .vault-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }

    .vault-sub {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.45;
    }

    .input-wrap {
      position: relative;
      width: 100%;
    }

    .vault-input {
      width: 100%;
      padding: 14px 46px 14px 18px;
      font-size: 1.05rem;
      text-align: center;
      letter-spacing: 0.12em;
      border: 2px solid #334155;
      border-radius: 12px;
      background: #1e293b;
      color: #f8fafc;
      outline: none;
      transition: all 0.2s;
    }

    .vault-input:focus {
      border-color: #c9182b;
      box-shadow: 0 0 0 3px rgba(201, 24, 43, 0.25);
    }

    .vault-input.shake {
      animation: shake 0.4s ease-in-out;
      border-color: #ef4444;
    }

    .toggle-vis {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 6px;
      line-height: 1;
    }

    .toggle-vis:hover {
      color: #f8fafc;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .vault-btn {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #c9182b 0%, #991b1b 100%);
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }

    .vault-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(201, 24, 43, 0.4);
    }

    .vault-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .vault-error {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .vault-lockout {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .vault-lockout .countdown {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ef4444;
      margin-top: 6px;
    }

    .vault-footer {
      margin-top: 24px;
      font-size: 0.72rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="vault-container" id="vaultScreen">
    <div class="vault-icon">🔐</div>
    <div class="vault-title">Encrypted Access Portal</div>
    <div class="vault-sub">Protected with AES-256-GCM encryption.<br>Enter the authorized passcode (case-sensitive) to continue.</div>

    <form id="vaultForm">
      <div class="input-wrap">
        <input
          type="password"
          id="vaultPass"
          class="vault-input"
          placeholder="••••••••"
          maxlength="48"
          autocomplete="off"
          autofocus
          required
        >
        <button type="button" class="toggle-vis" id="toggleVis" aria-label="Show or hide passcode" title="Show/Hide Passcode">👁️</button>
      </div>
      <button type="submit" class="vault-btn" id="vaultBtn">🔓 Decrypt &amp; Access</button>
    </form>

    <div class="vault-error" id="vaultError"></div>
    <div class="vault-lockout" id="vaultLockout">
      <div>🚫 Too many failed attempts. Access locked.</div>
      <div class="countdown" id="lockCountdown">--:--</div>
    </div>

    <div class="vault-footer">
      Authorized Access Only • AES-256-GCM • PBKDF2
    </div>
  </div>

      const ITERATIONS = 200000;

      const LOCKOUT_KEY = "vlt_lk";
      const ATTEMPTS_KEY = "vlt_at";
      const MAX_ATTEMPTS_TIER1 = 5;
      const MAX_ATTEMPTS_TIER2 = 10;
      const MAX_ATTEMPTS_TIER3 = 15;
      const LOCKOUT_TIER1 = 15 * 60 * 1000;
      const LOCKOUT_TIER2 = 60 * 60 * 1000;
      const LOCKOUT_TIER3 = 6 * 60 * 60 * 1000;

      const form = document.getElementById("vaultForm");
      const passInput = document.getElementById("vaultPass");
      const toggleVis = document.getElementById("toggleVis");
      const btn = document.getElementById("vaultBtn");
      const errorEl = document.getElementById("vaultError");
      const lockoutEl = document.getElementById("vaultLockout");
      const countdownEl = document.getElementById("lockCountdown");

      if (toggleVis) {
        toggleVis.addEventListener("click", () => {
          const isHidden = passInput.type === "password";
          passInput.type = isHidden ? "text" : "password";
          toggleVis.textContent = isHidden ? "🙈" : "👁️";
          passInput.focus();
        });
      }

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      function getAttempts() {
        try { return parseInt(localStorage.getItem(ATTEMPTS_KEY) || "0", 10); }
        catch { return 0; }
      }

      function setAttempts(n) {
        try { localStorage.setItem(ATTEMPTS_KEY, String(n)); }
        catch {}
      }

      function getLockoutEnd() {
        try {
          const v = localStorage.getItem(LOCKOUT_KEY);
          return v ? parseInt(v, 10) : 0;
        }
        catch { return 0; }
      }

      function setLockout(durationMs) {
        const end = Date.now() + durationMs;
        try { localStorage.setItem(LOCKOUT_KEY, String(end)); }
        catch {}
        return end;
      }

      function getLockoutDuration(attempts) {
        if (attempts >= MAX_ATTEMPTS_TIER3) return LOCKOUT_TIER3;
        if (attempts >= MAX_ATTEMPTS_TIER2) return LOCKOUT_TIER2;
        if (attempts >= MAX_ATTEMPTS_TIER1) return LOCKOUT_TIER1;
        return 0;
      }

      function checkLockout() {
        const end = getLockoutEnd();
        if (end && Date.now() < end) {
          passInput.disabled = true;
          btn.disabled = true;
          errorEl.style.display = "none";
          lockoutEl.style.display = "block";

          const tick = () => {
            const remaining = end - Date.now();
            if (remaining <= 0) {
              lockoutEl.style.display = "none";
              passInput.disabled = false;
              btn.disabled = false;
              passInput.focus();
              return;
            }
            const mins = Math.floor(remaining / 60000);
            const secs = Math.floor((remaining % 60000) / 1000);
            countdownEl.textContent = String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
            requestAnimationFrame(() => setTimeout(tick, 500));
          };
          tick();
          return true;
        }
        return false;
      }

        }
        const enc = new TextEncoder();
        const salt = b64ToBytes(SALT_B64);
        const iv = b64ToBytes(IV_B64);
        const ct = b64ToBytes(CT_B64);

        const keyMaterial = await crypto.subtle.importKey(
          "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
        );

        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: ITERATIONS, hash: "SHA-256" },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          aesKey,
          ct
        );

        return new TextDecoder().decode(decrypted);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (checkLockout()) return;

        const password = passInput.value.trim();
        if (!password) return;

        btn.disabled = true;
        btn.textContent = "🔄 Decrypting...";
        errorEl.style.display = "none";

        try {
          const html = await decrypt(password);

          setAttempts(0);
          try { localStorage.removeItem(LOCKOUT_KEY); } catch {}

          document.open();
          document.write(html);
          document.close();

        } catch (err) {
          if (err && err.message && err.message.includes("HTTPS")) {
            errorEl.textContent = "⚠️ Encryption requires HTTPS. Open via GitHub Pages URL.";
            errorEl.style.display = "block";
            btn.disabled = false;
            btn.textContent = "🔓 Decrypt & Access";
            return;
          }

          const attempts = getAttempts() + 1;
          setAttempts(attempts);

          const lockDuration = getLockoutDuration(attempts);
          if (lockDuration > 0) {
            setLockout(lockDuration);
            checkLockout();
          } else {
            const remaining = (attempts < MAX_ATTEMPTS_TIER1)
              ? MAX_ATTEMPTS_TIER1 - attempts
              : 0;
            errorEl.textContent = "❌ Wrong passcode." + (remaining > 0 ? ` ${remaining} attempt(s) left before lockout.` : "");
            errorEl.style.display = "block";
          }

          passInput.classList.add("shake");
          setTimeout(() => passInput.classList.remove("shake"), 400);

          btn.disabled = false;
          btn.textContent = "🔓 Decrypt & Access";
          passInput.value = "";
          passInput.focus();
        }
      });

      if (!checkLockout()) {
        passInput.focus();
      }
    })();
  </script>
